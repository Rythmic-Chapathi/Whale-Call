kind = "web"
previewPath = "/"
title = "Whale Call"
description = "Whale Call combines island rideshare booking with dedicated emergency response across a fictional island chain."
version = "1.0.0"
id = "artifacts/island-boat-rideshare"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24528

[services.development]
run = "pnpm --filter @workspace/island-boat-rideshare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/island-boat-rideshare", "run", "build" ]
serve = "static"
publicDir = "artifacts/island-boat-rideshare/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24528"
BASE_PATH = "/"
