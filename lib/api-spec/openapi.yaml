openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: geocoding
    description: Search real places in the Whale Call operating area
  - name: fleet
    description: Canonical island and boat fleet data
  - name: trips
    description: Standard boat ride requests and tracking
  - name: emergencies
    description: Emergency rescue dispatch
  - name: supplies
    description: Essential supply ordering and delivery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /geocode/search:
    get:
      operationId: searchLocations
      tags: [geocoding]
      summary: Search real locations in the operating area
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 5
      responses:
        "200":
          description: Matching locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationSearchResult"
        "400":
          description: Invalid search query
        "429":
          description: Nominatim rate limit
        "502":
          description: Geocoding service unavailable
  /islands:
    get:
      operationId: listIslands
      tags: [fleet]
      summary: List island and dock data
      responses:
        "200":
          description: Islands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Island"
  /fleet:
    get:
      operationId: listFleet
      tags: [fleet]
      summary: List boats in the canonical fleet
      parameters:
        - name: boatClass
          in: query
          schema:
            $ref: "#/components/schemas/BoatClass"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BoatStatus"
        - name: emergencyEquipped
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Fleet boats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetBoat"
  /fleet/summary:
    get:
      operationId: getFleetSummary
      tags: [fleet]
      summary: Get fleet availability summary
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetSummary"
  /fleet/{boatId}:
    get:
      operationId: getFleetBoat
      tags: [fleet]
      summary: Get one boat and its assigned driver
      parameters:
        - $ref: "#/components/parameters/BoatId"
      responses:
        "200":
          description: Boat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetBoat"
        "404":
          description: Boat not found
  /trips:
    post:
      operationId: createTrip
      tags: [trips]
      summary: Request a standard boat ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid trip request
  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip status and tracking data
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found
  /trips/{tripId}/complete:
    post:
      operationId: completeTrip
      tags: [trips]
      summary: Complete a trip and return its summary
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Completed trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Trip not found
  /emergencies:
    post:
      operationId: createEmergency
      tags: [emergencies]
      summary: Dispatch the nearest rescue boat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyInput"
      responses:
        "201":
          description: Emergency dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyIncident"
        "400":
          description: Invalid emergency request
  /emergencies/{emergencyId}:
    get:
      operationId: getEmergency
      tags: [emergencies]
      summary: Get emergency dispatch status
      parameters:
        - $ref: "#/components/parameters/EmergencyId"
      responses:
        "200":
          description: Emergency incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyIncident"
        "404":
          description: Emergency not found
  /emergencies/{emergencyId}/resolve:
    post:
      operationId: resolveEmergency
      tags: [emergencies]
      summary: Mark an emergency incident resolved
      parameters:
        - $ref: "#/components/parameters/EmergencyId"
      responses:
        "200":
          description: Resolved incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyIncident"
        "404":
          description: Emergency not found
  /supplies/catalog:
    get:
      operationId: listSupplyCatalog
      tags: [supplies]
      summary: List supply items and live availability
      responses:
        "200":
          description: Supply catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyCatalogItem"
  /supplies/depots:
    get:
      operationId: listSupplyDepots
      tags: [supplies]
      summary: List supply depots and live stock
      responses:
        "200":
          description: Supply depots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyDepot"
  /supplies/availability:
    get:
      operationId: getSupplyAvailability
      tags: [supplies]
      summary: Check nearby stock for one supply line
      parameters:
        - name: itemId
          in: query
          required: true
          schema:
            type: string
        - name: quantity
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Nearby availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyAvailability"
  /supplies/orders:
    post:
      operationId: createSupplyOrder
      tags: [supplies]
      summary: Source supplies and allocate a delivery boat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOrderInput"
      responses:
        "201":
          description: Supply order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
        "400":
          description: Invalid order
        "409":
          description: Stock or boat capacity conflict
  /supplies/orders/{supplyOrderId}:
    get:
      operationId: getSupplyOrder
      tags: [supplies]
      summary: Get one live supply run
      parameters:
        - $ref: "#/components/parameters/SupplyOrderId"
      responses:
        "200":
          description: Supply order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
        "404":
          description: Supply order not found
  /supplies/orders/{supplyOrderId}/cancel:
    post:
      operationId: cancelSupplyOrder
      tags: [supplies]
      summary: Cancel a pending supply run and release reservations
      parameters:
        - $ref: "#/components/parameters/SupplyOrderId"
      responses:
        "200":
          description: Cancelled supply order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
  /supplies/orders/{supplyOrderId}/age:
    post:
      operationId: ageSupplyOrder
      tags: [supplies]
      summary: Age a supply run by five minutes in development
      parameters:
        - $ref: "#/components/parameters/SupplyOrderId"
      responses:
        "200":
          description: Aged supply order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
  /supplies/queue:
    get:
      operationId: getSupplyQueue
      tags: [supplies]
      summary: List active supply runs sorted by live priority
      responses:
        "200":
          description: Live dispatch queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyOrder"
  /emergencies/{emergencyId}/supplies:
    patch:
      operationId: attachEmergencySupplies
      tags: [supplies, emergencies]
      summary: Attach a supply order to an emergency dispatch
      parameters:
        - $ref: "#/components/parameters/EmergencyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencySupplyInput"
      responses:
        "201":
          description: Emergency supply order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
  /dev/reset:
    post:
      operationId: resetDemo
      tags: [supplies]
      summary: Reset demo fleet, inventory, and orders outside production
      responses:
        "200":
          description: Demo reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
components:
  parameters:
    BoatId:
      name: boatId
      in: path
      required: true
      schema:
        type: string
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    EmergencyId:
      name: emergencyId
      in: path
      required: true
      schema:
        type: string
    SupplyOrderId:
      name: supplyOrderId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LocationSearchResult:
      type: object
      properties:
        placeId:
          type: string
        displayName:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        category:
          type: string
        type:
          type: string
      required: [placeId, displayName, name, lat, lng, category, type]
    Coordinate:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required: [lat, lng]
    Dock:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        position:
          $ref: "#/components/schemas/Coordinate"
      required: [id, name, position]
    Island:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        center:
          $ref: "#/components/schemas/Coordinate"
        coastline:
          type: array
          items:
            $ref: "#/components/schemas/Coordinate"
        docks:
          type: array
          items:
            $ref: "#/components/schemas/Dock"
        hasRescueStation:
          type: boolean
      required: [id, name, tagline, center, coastline, docks, hasRescueStation]
    BoatClass:
      type: string
      enum: [water_taxi, cruiser, catamaran, speedboat, rescue]
    BoatStatus:
      type: string
      enum: [available, en_route, on_trip, offline]
    DriverCertification:
      type: string
      enum: [medical, tow, night_ops]
    Driver:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string
        rating:
          type: number
        tripsCompleted:
          type: integer
        yearsActive:
          type: integer
        languages:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/DriverCertification"
      required: [id, name, avatar, rating, tripsCompleted, yearsActive, languages, certifications]
    FleetBoat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        boatClass:
          $ref: "#/components/schemas/BoatClass"
        capacity:
          type: integer
        position:
          $ref: "#/components/schemas/Coordinate"
        heading:
          type: number
        status:
          $ref: "#/components/schemas/BoatStatus"
        assignedDriver:
          $ref: "#/components/schemas/Driver"
        homeIslandId:
          type: string
        emergencyEquipped:
          type: boolean
        payloadKg:
          type: number
        refrigerated:
          type: boolean
      required: [id, name, boatClass, capacity, position, heading, status, assignedDriver, homeIslandId, emergencyEquipped, payloadKg, refrigerated]
    FleetSummary:
      type: object
      properties:
        total:
          type: integer
        available:
          type: integer
        onTrip:
          type: integer
        rescueReady:
          type: integer
        activeIslands:
          type: integer
      required: [total, available, onTrip, rescueReady, activeIslands]
    TripInput:
      type: object
      properties:
        pickupIslandId:
          type: string
        pickupDockId:
          type: string
        destinationIslandId:
          type: string
        destinationDockId:
          type: string
        boatClass:
          type: string
          enum: [water_taxi, cruiser, catamaran, speedboat]
        passengerCount:
          type: integer
          minimum: 1
          maximum: 16
      required: [pickupIslandId, pickupDockId, destinationIslandId, destinationDockId, boatClass, passengerCount]
    Trip:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [matching, assigned, arriving, arrived, in_transit, completed]
        pickupIslandId:
          type: string
        pickupDockId:
          type: string
        destinationIslandId:
          type: string
        destinationDockId:
          type: string
        boatClass:
          type: string
        passengerCount:
          type: integer
        boat:
          $ref: "#/components/schemas/FleetBoat"
        price:
          type: number
        etaMinutes:
          type: integer
        distanceKm:
          type: number
        requestedAt:
          type: string
          format: date-time
        targetArrivalAt:
          type: string
          format: date-time
      required: [id, status, pickupIslandId, pickupDockId, destinationIslandId, destinationDockId, boatClass, passengerCount, boat, price, etaMinutes, distanceKm, requestedAt, targetArrivalAt]
    EmergencySituation:
      type: string
      enum: [stranded, medical, taking_on_water, other]
    EmergencyInput:
      type: object
      properties:
        situation:
          $ref: "#/components/schemas/EmergencySituation"
        position:
          $ref: "#/components/schemas/Coordinate"
        notes:
          type: string
        tripId:
          type: ["string", "null"]
      required: [situation, position, notes]
    EmergencyIncident:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [dispatching, responding, on_scene, resolved]
        situation:
          $ref: "#/components/schemas/EmergencySituation"
        position:
          $ref: "#/components/schemas/Coordinate"
        notes:
          type: string
        rescueBoat:
          $ref: "#/components/schemas/FleetBoat"
        etaMinutes:
          type: integer
        distanceKm:
          type: number
        createdAt:
          type: string
          format: date-time
        tripId:
          type: ["string", "null"]
      required: [id, status, situation, position, notes, rescueBoat, etaMinutes, distanceKm, createdAt, tripId]
    SupplyCategory:
      type: string
      enum: [medical, water, food, power, shelter, comms]
    SupplyItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/SupplyCategory"
        unit:
          type: string
        weightKg:
          type: number
        coldChain:
          type: boolean
        criticality:
          type: integer
          minimum: 1
          maximum: 3
        maxPerOrder:
          type: integer
      required: [id, name, category, unit, weightKg, coldChain, criticality, maxPerOrder]
    SupplyCatalogItem:
      allOf:
        - $ref: "#/components/schemas/SupplyItem"
        - type: object
          properties:
            availableTotal:
              type: integer
          required: [availableTotal]
    SupplyDepot:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        islandId:
          type: string
        dockId:
          type: string
        position:
          $ref: "#/components/schemas/Coordinate"
        hours:
          type: string
        available:
          type: object
          additionalProperties:
            type: integer
      required: [id, name, islandId, dockId, position, hours, available]
    SupplyAvailability:
      type: object
      properties:
        depotId:
          type: string
        depotName:
          type: string
        available:
          type: integer
        distanceKm:
          type: number
        etaMinutes:
          type: integer
      required: [depotId, depotName, available, distanceKm, etaMinutes]
    SupplyOrderLineInput:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [itemId, quantity]
    SupplyOrderLine:
      type: object
      properties:
        itemId:
          type: string
        quantity:
          type: integer
        depotId:
          type: string
      required: [itemId, quantity, depotId]
    SupplyOrderInput:
      type: object
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SupplyOrderLineInput"
        destinationIslandId:
          type: ["string", "null"]
        destinationDockId:
          type: ["string", "null"]
        destinationPosition:
          $ref: "#/components/schemas/Coordinate"
        urgency:
          type: string
          enum: [routine, urgent, critical]
        accessibilityNeed:
          type: boolean
        requesterNote:
          type: string
        linkedEmergencyId:
          type: ["string", "null"]
      required: [lines, destinationPosition, urgency, accessibilityNeed, requesterNote]
    EmergencySupplyInput:
      type: object
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SupplyOrderLineInput"
      required: [lines]
    SupplyOrder:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: ["string", "null"]
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SupplyOrderLine"
        requestedLines:
          type: array
          items:
            $ref: "#/components/schemas/SupplyOrderLineInput"
        destinationIslandId:
          type: ["string", "null"]
        destinationDockId:
          type: ["string", "null"]
        destinationPosition:
          $ref: "#/components/schemas/Coordinate"
        requesterNote:
          type: string
        urgency:
          type: string
          enum: [routine, urgent, critical]
        accessibilityNeed:
          type: boolean
        linkedEmergencyId:
          type: ["string", "null"]
        priorityScore:
          type: number
        priorityReason:
          type: string
        status:
          type: string
          enum: [sourcing, allocated, loading, in_transit, delivered, partially_filled, cancelled]
        boatId:
          type: ["string", "null"]
        boat:
          oneOf:
            - $ref: "#/components/schemas/FleetBoat"
            - type: "null"
        totalWeightKg:
          type: number
        etaMinutes:
          type: ["integer", "null"]
        distanceKm:
          type: number
        fare:
          type: number
        unfilledLines:
          type: array
          items:
            $ref: "#/components/schemas/SupplyOrderLineInput"
        allocationNote:
          type: ["string", "null"]
      required: [id, createdAt, deliveredAt, lines, requestedLines, destinationIslandId, destinationDockId, destinationPosition, requesterNote, urgency, accessibilityNeed, linkedEmergencyId, priorityScore, priorityReason, status, boatId, boat, totalWeightKg, etaMinutes, distanceKm, fare, unfilledLines, allocationNote]

